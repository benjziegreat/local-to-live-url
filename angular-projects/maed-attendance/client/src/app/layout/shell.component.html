@if (auth.user(); as user) {
  <aside class="sidebar glass">
    <div class="brand">
      <span class="logo"><app-icon name="radar" [size]="20" /></span>
      <div>
        <strong>MAEd Attendance</strong>
        <small>Geo-fenced ecosystem</small>
      </div>
    </div>

    <div class="portal">
      <span class="eyebrow">{{ portal().subtitle }}</span>
      <strong>{{ portal().title }}</strong>
    </div>

    <nav aria-label="Sections">
      @for (item of portal().nav; track item.id) {
        <button type="button" class="nav-item" [class.active]="active() === item.id" (click)="go(item)">
          <app-icon [name]="item.icon" /> {{ item.label }}
        </button>
      }
    </nav>

    <div class="spacer"></div>

    <div class="me">
      <app-avatar [name]="user.name" [hue]="user.avatarHue" [size]="38" />
      <div class="who">
        <strong>{{ user.name }}</strong>
        <small>{{ user.email }}</small>
      </div>
    </div>
    <div class="row">
      <button type="button" class="btn ghost sm" (click)="toggleTheme()" [attr.aria-label]="'Switch to ' + (theme() === 'dark' ? 'light' : 'dark') + ' mode'">
        <app-icon [name]="theme() === 'dark' ? 'sun' : 'moon'" [size]="16" /> {{ theme() === 'dark' ? 'Light' : 'Dark' }}
      </button>
      <button type="button" class="btn ghost sm" (click)="auth.logout()">
        <app-icon name="logout" [size]="16" /> Sign out
      </button>
    </div>
  </aside>

  <header class="topbar glass">
    <span class="logo"><app-icon name="radar" [size]="18" /></span>
    <div class="title">
      <strong>{{ portal().title }}</strong>
      <small>{{ user.name }}</small>
    </div>
    <button type="button" class="btn ghost icon-only" (click)="toggleTheme()" aria-label="Toggle theme">
      <app-icon [name]="theme() === 'dark' ? 'sun' : 'moon'" />
    </button>
    <button type="button" class="btn ghost icon-only" (click)="auth.logout()" aria-label="Sign out">
      <app-icon name="logout" />
    </button>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <nav class="bottom-nav glass" aria-label="Sections">
    @for (item of portal().nav; track item.id) {
      <button type="button" [class.active]="active() === item.id" (click)="go(item)">
        <app-icon [name]="item.icon" [size]="20" />
        <span>{{ item.label }}</span>
      </button>
    }
  </nav>
}
