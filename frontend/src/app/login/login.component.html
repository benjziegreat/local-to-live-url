<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4 text-slate-900">
  <form
    (ngSubmit)="submit()"
    class="w-full max-w-sm rounded-xl border border-slate-200 bg-white p-6 shadow-sm"
  >
    <h1 class="text-xl font-semibold tracking-tight">Tunnel Admin Dashboard</h1>
    <p class="mt-1 text-sm text-slate-500">
      {{ auth.lockReason() ? 'Locked. Enter your password to continue.' : 'Sign in to continue.' }}
    </p>

    @if (auth.lockReason(); as reason) {
      <div class="mt-4 rounded-md border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-800">
        {{ reason }}
      </div>
    }

    <label class="mt-5 block text-sm font-medium text-slate-700" for="username">Username</label>
    <input
      id="username"
      name="username"
      type="text"
      autocomplete="username"
      required
      [(ngModel)]="username"
      class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none"
    />

    <label class="mt-4 block text-sm font-medium text-slate-700" for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      required
      autofocus
      [(ngModel)]="password"
      class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none"
    />

    @if (error(); as message) {
      <p class="mt-3 text-sm text-red-600">{{ message }}</p>
    }

    <button
      type="submit"
      [disabled]="submitting() || !username || !password"
      class="mt-5 w-full rounded-md bg-slate-900 px-3 py-2 text-sm font-medium text-white transition-colors hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-50"
    >
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
